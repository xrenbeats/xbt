name: Build iOS IPA
on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Native iOS Wrapper
        run: |
          cordova create build_wrapper com.githubuser.webapp WebApp
          cd build_wrapper
          cordova platform add ios
          
          rm -rf www/*
          cp ../index.html www/
          cp ../style.css www/
          
          cp ../Info.plist platforms/ios/App/App-Info.plist

      - name: Compile Unsigned IPA
        run: |
          cd build_wrapper
          
          xcodebuild build \
            -workspace platforms/ios/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=./build_output

          # Package the payload
          mkdir -p ../build/Payload
          cp -R build_output/App.app ../build/Payload/
          cd ../build
          zip -r WebApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: web-app-unsigned-ipa
          path: build/WebApp.ipa

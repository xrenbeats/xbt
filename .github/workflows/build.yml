name: Build iOS IPA
on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Native iOS Wrapper
        run: |
          cordova create build_wrapper com.example.app WebApp
          cd build_wrapper
          cordova platform add ios
          
          # Copy your custom web assets into the wrapper
          rm -rf www/*
          cp ../index.html www/
          cp ../style.css www/
          
          # FIX: Cordova 8 hardcodes the internal technical target directory name to "App"
          cp ../Info.plist platforms/ios/App/App-Info.plist

      - name: Compile Unsigned IPA
        run: |
          cd build_wrapper
          # FIX: Point the build scheme parameters to the hardcoded "App" workspace configurations
          xcodebuild -workspace platforms/ios/App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO

          # Package the compiled app layout into the required folder tree for SideStore
          mkdir -p ../build/Payload
          cp -R build/emulator/App.app ../build/Payload/
          cd ../build
          zip -r WebApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: web-app-unsigned-ipa
          path: build/WebApp.ipa

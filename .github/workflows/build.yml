name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Native iOS Wrapper
        run: |
          set -euo pipefail
          cordova create build_wrapper com.githubuser.webapp WebApp
          cd build_wrapper
          cordova platform add ios

          # Replace default www with the repo's web files (html/css/js/images/etc.)
          rm -rf www/*
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build_wrapper' \
            --exclude 'build' \
            --exclude 'Info.plist' \
            --exclude 'README*' \
            ../ www/

          if [ ! -f www/index.html ]; then
            echo "index.html not found in repo root"
            exit 1
          fi

          cordova prepare ios

          # Optional: use a custom Info.plist if one exists in the repo root
          if [ -f "../Info.plist" ]; then
            INFO_PLIST=$(find platforms/ios -type f \( -name 'Info.plist' -o -name '*-Info.plist' \) ! -path '*/CordovaLib/*' ! -path '*/build/*' ! -path '*/Pods/*' | head -n 1)
            if [ -z "$INFO_PLIST" ]; then
              echo "Could not find generated Info.plist under platforms/ios"
              exit 1
            fi
            echo "Using custom Info.plist -> $INFO_PLIST"
            cp ../Info.plist "$INFO_PLIST"
            plutil -lint "$INFO_PLIST"
          fi

      - name: Compile Unsigned IPA
        run: |
          set -euo pipefail
          cd build_wrapper/platforms/ios

          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          ls

          # Newer Cordova iOS projects may have no .xcworkspace (only .xcodeproj)
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            CONTAINER=(-workspace "$(ls -d *.xcworkspace | head -n 1)")
          else
            CONTAINER=(-project "$(ls -d *.xcodeproj | head -n 1)")
          fi
          echo "Container: ${CONTAINER[*]}"

          # Discover the scheme instead of hardcoding it
          xcodebuild -list "${CONTAINER[@]}"
          SCHEME=$(xcodebuild -list -json "${CONTAINER[@]}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          info = d.get('workspace') or d.get('project')
          schemes = info['schemes']
          pick = 'WebApp' if 'WebApp' in schemes else next((s for s in schemes if s != 'CordovaLib'), schemes[0])
          print(pick)
          ")
          echo "Scheme: $SCHEME"

          if ! xcodebuild build \
            "${CONTAINER[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"; then
            echo "::group::xcodebuild errors"
            grep -E "error:|BUILD FAILED|fatal" "$GITHUB_WORKSPACE/xcodebuild.log" | head -n 40 || true
            echo "::endgroup::"
            exit 1
          fi

          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Built .app not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/"
          cd "$GITHUB_WORKSPACE/build"
          zip -qry WebApp.ipa Payload

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: web-app-unsigned-ipa
          path: build/WebApp.ipa
          if-no-files-found: error

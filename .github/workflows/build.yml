name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Native iOS Wrapper
        run: |
          set -e
          cordova create build_wrapper com.githubuser.webapp WebApp
          cd build_wrapper
          cordova platform add ios
          rm -rf www/*
          cp ../index.html www/
          cp ../style.css www/
          cordova prepare ios
          INFO_PLIST=$(find platforms/ios -type f \( -name 'Info.plist' -o -name '*-Info.plist' \) ! -path '*/CordovaLib/*' ! -path '*/build/*' | head -n 1)
          if [ -z "$INFO_PLIST" ]; then
            echo "Could not find generated Info.plist under platforms/ios"
            exit 1
          fi
          if [ -f "../Info.plist" ]; then
            cp ../Info.plist "$INFO_PLIST"
          fi

      - name: Compile Unsigned IPA
        run: |
          set -e
          cd build_wrapper
          xcodebuild build \
            -workspace platforms/ios/WebApp.xcworkspace \
            -scheme WebApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR=./build_output
          mkdir -p ../build/Payload
          cp -R build_output/WebApp.app ../build/Payload/
          cd ../build
          zip -r WebApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: web-app-unsigned-ipa
          path: build/WebApp.ipa
